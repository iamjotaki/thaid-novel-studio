version: '3.8'

services:
  readawrite-studio:
    build: .
    container_name: readawrite-studio
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Persistent SQLite Database & Covers
      - ./data:/app/data
      # Persistent ReadAWrite User Sessions (Cookies)
      - ./user_sessions:/app/user_sessions
